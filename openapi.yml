openapi: 3.1.0
info:
  title: Netzence Carbon Credits
  version: 1.0.0
paths:
  /rides/completed:
    post:
      tags:
      - Rides
      summary: Record a completed ride and award credits
      description: Idempotent on ride_id. Electric rides earn 0.12 credits/km, valid
        12 months.
      operationId: completed_rides_completed_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideCompletedRequest'
        required: true
      responses:
        '200':
          description: 'Duplicate event: already recorded, nothing changed'
          content:
            application/json:
              schema: {}
        '201':
          description: Ride recorded, credits awarded
        '409':
          description: Same ride_id already recorded with different details
        '422':
          description: Validation failed
  /rides/cancelled:
    post:
      tags:
      - Rides
      summary: Reverse a ride's credits (refunded/cancelled after completion)
      description: 'Reverses the ride''s unspent credits; the original entry stays
        in history.

        If the ride hasn''t arrived yet, the cancellation is kept as pending (202).'
      operationId: cancelled_rides_cancelled_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideCancelledRequest'
        required: true
      responses:
        '200':
          description: 'Reversed, or duplicate event: already processed'
          content:
            application/json:
              schema: {}
        '202':
          description: 'Ride not completed yet: stored as pending, reversed when it
            arrives'
        '422':
          description: Validation failed
  /rides/cancellations/pending:
    get:
      tags:
      - Rides
      summary: Cancellations still waiting for their ride's completion
      description: Pending cancellations whose ride still hasn't arrived after `older_than_hours`.
      operationId: pending_cancellations_rides_cancellations_pending_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Per Page
      - name: older_than_hours
        in: query
        required: false
        schema:
          type: integer
          maximum: 8760
          minimum: 0
          default: 48
          title: Older Than Hours
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /drivers/{driver_id}/balance:
    get:
      tags:
      - Drivers
      summary: Current balance (unexpired credits only)
      description: Unexpired, unspent credits only.
      operationId: balance_drivers__driver_id__balance_get
      parameters:
      - name: driver_id
        in: path
        required: true
        schema:
          type: string
          title: Driver Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: Driver has no recorded rides
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /drivers/{driver_id}/history:
    get:
      tags:
      - Drivers
      summary: Every credit and debit with its reason
      description: Every credit, debit and reversal with its reason, newest first.
      operationId: history_drivers__driver_id__history_get
      parameters:
      - name: driver_id
        in: path
        required: true
        schema:
          type: string
          title: Driver Id
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Per Page
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: Driver has no recorded rides
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /drivers/{driver_id}/redeem:
    post:
      tags:
      - Drivers
      summary: Spend credits (oldest expiry first)
      description: Spend credits, soonest-expiring first. Never takes the balance
        below zero.
      operationId: redeem_drivers__driver_id__redeem_post
      parameters:
      - name: driver_id
        in: path
        required: true
        schema:
          type: string
          title: Driver Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Required. Generate one (e.g. a UUID) per redeem attempt and
            resend it, with the same body, only when retrying after no response. The
            redeem then happens only once.
          title: Idempotency-Key
        description: Required. Generate one (e.g. a UUID) per redeem attempt and resend
          it, with the same body, only when retrying after no response. The redeem
          then happens only once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
      responses:
        '200':
          description: 'Idempotent replay: this redemption already happened'
          content:
            application/json:
              schema: {}
        '201':
          description: Redeemed
        '404':
          description: Driver has no recorded rides
        '409':
          description: Idempotency-Key reused with a different request body
        '422':
          description: Insufficient balance, or validation failed
  /health:
    get:
      tags:
      - System
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    RedeemRequest:
      properties:
        amount:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
          title: Amount
        reason:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Reason
      type: object
      required:
      - amount
      title: RedeemRequest
      example:
        amount: '2.000'
        reason: Charging voucher
    RideCancelledRequest:
      properties:
        ride_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Ride Id
        reason:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Reason
      type: object
      required:
      - ride_id
      title: RideCancelledRequest
      example:
        reason: Refunded to passenger
        ride_id: ride_001
    RideCompletedRequest:
      properties:
        ride_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Ride Id
        driver_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Driver Id
        distance_km:
          anyOf:
          - type: number
            maximum: 10000.0
            minimum: 0.0
          - type: string
          title: Distance Km
        vehicle_type:
          $ref: '#/components/schemas/VehicleType'
        completed_at:
          type: string
          format: date-time
          title: Completed At
      type: object
      required:
      - ride_id
      - driver_id
      - distance_km
      - vehicle_type
      - completed_at
      title: RideCompletedRequest
      example:
        completed_at: '2026-10-01T09:30:00Z'
        distance_km: 12.5
        driver_id: driver_42
        ride_id: ride_001
        vehicle_type: electric
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VehicleType:
      type: string
      enum:
      - electric
      - hybrid
      - petrol
      - diesel
      title: VehicleType
