[alembic]
# layout: database/env.py + database/migrations/<date>_<name>.py
script_location = database
version_locations = %(here)s/database/migrations
prepend_sys_path = .
# new files: 2026_11_02_120000_create_x_table.py   (make migration name=create_x_table)
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s
# URL comes from app.config (DATABASE_URL env), see database/env.py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
